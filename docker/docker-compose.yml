version: "3.9"

services:

  rm563197-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rm563197-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: azure
      APP_PORT: "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api-docs > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
