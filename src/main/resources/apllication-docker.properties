spring.application.name=phycoCarbon

# DataSource — sobrescrito por variáveis de ambiente do docker-compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://rm563197-db:5432/phycocarbon}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:phycouser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:phyco@2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA — PostgreSQL
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Remove o schema Oracle (PostgreSQL usa public por padrão)
# spring.jpa.properties.hibernate.default_schema=

spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null

# Servidor
server.port=${APP_PORT:8080}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
aquaorbital.jwt.secret=${AQUAORBITAL_JWT_SECRET:aquaorbital-secret-key-fiap-global-solution-2026-very-long-key}
aquaorbital.jwt.expiration=${AQUAORBITAL_JWT_EXPIRATION:86400000}

# Logs
logging.level.br.com.fiap.Phycocarbon=INFO

# INMET
inmet.estacao.codigo=A701
inmet.estacao.janela-dias=1
inmet.estacao.cron=0 0 1 * * *
