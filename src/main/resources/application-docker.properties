# Banco de Dados (PostgreSQL no container rm563197-db)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=rm562085
spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null

# Servidor
server.port=${APP_PORT:8080}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
aquaorbital.jwt.secret=${AQUAORBITAL_JWT_SECRET}
aquaorbital.jwt.expiration=${AQUAORBITAL_JWT_EXPIRATION:86400000}

# INMET
inmet.estacao.codigo=${INMET_ESTACAO_CODIGO:A701}
inmet.estacao.janela-dias=${INMET_JANELA_DIAS:1}
inmet.estacao.cron=${INMET_CRON:0 0 1 * * *}

# Logs
logging.level.br.com.fiap.Phycocarbon=INFO
logging.level.org.hibernate.SQL=WARN
